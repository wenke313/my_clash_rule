name: 同步 AI 域名规则

on:
  schedule:
    # 每天 UTC 20:17（北京时间 04:17），避开整点高峰；仓库 rule-provider interval 8h 自动拉
    - cron: '17 20 * * *'
  workflow_dispatch:      # 支持手动触发
  push:
    branches: [main]
    paths:
      - 'scripts/sync_ai_domains.py'
      - 'sources/ai-local-additions.yaml'

permissions:
  contents: write         # 需要 commit + push

concurrency:
  group: sync-ai-domains
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 生成规则并检查差异
        id: gen
        run: |
          set -euo pipefail
          python scripts/sync_ai_domains.py --check && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: 写入新规则
        if: steps.gen.outputs.changed == 'true'
        run: python scripts/sync_ai_domains.py

      - name: 校验 YAML 可被解析
        if: steps.gen.outputs.changed == 'true'
        run: |
          set -euo pipefail
          python - <<'PY'
          import sys
          # 不引 PyYAML：只校验 payload 结构与条目格式，够用了
          for v in ('OpenAI', 'Claude', 'Gemini', 'Grok'):
              p = f'{v}.yaml'
              lines = open(p, encoding='utf-8').read().splitlines()
              assert lines[0].startswith('#'), f'{p} 缺少头部注释'
              idx = lines.index('payload:')
              body = [l for l in lines[idx+1:] if l.strip() and not l.strip().startswith('#')]
              assert body, f'{p} payload 为空'
              for l in body:
                  assert l.startswith('  - '), f'{p} 条目缩进异常: {l!r}'
                  item = l[4:]
                  assert ',' in item, f'{p} 条目缺逗号: {l!r}'
                  kind = item.split(',', 1)[0]
                  assert kind in ('DOMAIN', 'DOMAIN-SUFFIX', 'DOMAIN-KEYWORD'), f'{p} 未知类型 {kind}'
              print(f'  {p}: {len(body)} 条 OK')
          PY

      - name: 提交并推送
        if: steps.gen.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add OpenAI.yaml Claude.yaml Gemini.yaml Grok.yaml
          # 双保险：确认真的只有这 4 个文件变化
          git diff --cached --name-only | tee /tmp/staged.txt
          if grep -qvE '^(OpenAI|Claude|Gemini|Grok)\.yaml$' /tmp/staged.txt; then
            echo "::error::检测到预期外的文件变更，中止"
            exit 1
          fi
          git commit -m "规则: 自动同步 AI 域名(OpenAI/Claude/Gemini/Grok) $(date -u '+%Y-%m-%d')"
          git push

      - name: 无需更新
        if: steps.gen.outputs.changed == 'false'
        run: echo "上游无变化，跳过提交"
