  #   antigravity.google.com 结尾是 .com，不被覆盖，必须单独列
  - DOMAIN-SUFFIX,gemini.app.google
  - DOMAIN-SUFFIX,gemini.clients6.google.com
  - DOMAIN-SUFFIX,signaler-pa.clients6.google.com
  - DOMAIN-SUFFIX,alkalimakersuite.apps.google.com
  - DOMAIN-SUFFIX,2webchannel-alkalimakersuite-pa.clients6.google.com

