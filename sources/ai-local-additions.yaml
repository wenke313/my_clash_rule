# 本地增益清单 — 上游 v2fly 未收录、但需要走对应 AI 组的域名
#
# 为什么存在这个文件：
#   生成的 OpenAI.yaml / Claude.yaml / Gemini.yaml / Grok.yaml 由
#   scripts/sync_ai_domains.py 覆盖式重写，手改会被冲掉。
#   上游还没收录的新域名写在这里，每次生成自动并入，永不被覆盖。
#
# 写法：厂商名下缩进两格，`- DOMAIN-SUFFIX,域名`（含子域）或 `- DOMAIN,域名`（精确）
# 原则：父域已被上游覆盖的就别再写（脚本会自动去重，但保持清单干净）

